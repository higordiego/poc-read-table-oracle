spring:
  application:
    name: oracle-read-projection-poc
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:projection_app}
    password: ${DB_PASSWORD:ProjectionPwd123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 30000
      data-source-properties:
        oracle.jdbc.defaultConnectionValidation: LOCAL
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

projection:
  bootstrap-on-startup: ${PROJECTION_BOOTSTRAP_ON_STARTUP:true}
  wait-timeout: ${PROJECTION_BOOTSTRAP_WAIT_TIMEOUT:180s}
  poll-interval: ${PROJECTION_BOOTSTRAP_POLL_INTERVAL:1s}

logging:
  level:
    com.example.projection: INFO
